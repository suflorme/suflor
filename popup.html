<!doctype html><html lang="tr"><meta charset="utf-8"><title>Suflor.me</title>
<style>
:root{color-scheme:light dark;--s1:#fff;--s2:#f6f6f4;--tx:#1d1d1b;--t2:#5f5e5a;--t3:#8c8b85;--bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.16);--hov:rgba(0,0,0,.05);--ac:#2f6fd6;--ok:#2e8a4f;--wa:#b26a00;--er:#c0362c;--er-bg:#fbe9e7}
@media (prefers-color-scheme:dark){:root{--s1:#242423;--s2:#1b1b1a;--tx:#ecebe7;--t2:#b3b1aa;--t3:#86847e;--bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.18);--hov:rgba(255,255,255,.06);--ac:#7aa7f0;--ok:#6cc08a;--wa:#e5a64a;--er:#f08a80;--er-bg:#3d211e}}
*{box-sizing:border-box}
body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;width:330px;margin:0;padding:12px;background:var(--s2);color:var(--tx)}
.hd{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.brand{font-weight:600;display:flex;align-items:center;gap:6px}.brand i{width:9px;height:9px;border-radius:3px;background:var(--ac);display:inline-block;transform:rotate(45deg)}
.chip{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--hov);color:var(--t2)}.chip.alan{background:var(--ac);color:#fff;font-weight:500}.chip.alan:empty{display:none}
#sec{background:var(--s1);border:1px solid var(--ac);border-radius:10px;padding:10px 12px;margin-bottom:10px}.sec-t{font-weight:600;margin-bottom:8px}.sec-b{display:flex;gap:6px;flex-wrap:wrap}.sec-n{font-size:11px;color:var(--t3);margin-top:8px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:4px 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);min-height:36px}.row:last-child{border-bottom:0}
.row .n{display:flex;align-items:center;gap:8px;white-space:nowrap}.row .v{color:var(--t2);font-size:12px;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t3);flex:none}.dot.ok{background:var(--ok)}.dot.wa{background:var(--wa)}.dot.er{background:var(--er)}
button{font:inherit;font-size:12px;color:var(--tx);background:var(--s1);border:1px solid var(--bd2);border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap}button:hover{background:var(--hov)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.sm{padding:2px 9px;font-size:11px}
.bt{display:flex;gap:6px;margin-top:10px}.bt .grow{flex:1}
#uy:empty{display:none}#uy{background:var(--er-bg);color:var(--er);border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:8px}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:var(--s1);border:1px solid var(--bd2);border-radius:8px;padding:6px 8px;outline:none}textarea{resize:none}
textarea:focus,input:focus,select:focus{border-color:var(--ac)}
.not{margin-top:10px}.not .bt{margin-top:6px}.ok-t{color:var(--ok);font-size:12px;align-self:center}
details{margin-top:10px}summary{cursor:pointer;color:var(--t2);font-size:12px;list-style:none;display:flex;align-items:center;gap:6px}summary::-webkit-details-marker{display:none}summary::before{content:"›";display:inline-block;transition:transform .15s}details[open] summary::before{transform:rotate(90deg)}
.set{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.set label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--t2)}.set label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--tx)}.set label.ck input{width:auto;margin:0;accent-color:var(--ac)}
</style>
<div class="hd"><span class="brand"><i></i>Suflor.me<span class="chip alan" id="alan" title="Bu Chrome'un yazdığı çalışma alanı"></span></span><span class="chip" id="ver"></span></div>
<div id="sec" hidden><div class="sec-t">Bu Chrome hangi çalışma alanına yazsın?</div><div class="sec-b" id="secb"></div><div class="sec-n">Bu Mac'te birden fazla Suflor.me aktarıcısı çalışıyor. Bir kez seç; Ayarlar'dan değiştirebilirsin.</div></div>
<div id="uy"></div>
<div class="card" id="baglanti">
  <div class="row"><span class="n"><span class="dot" id="d-ak"></span>Aktarıcı</span><span class="v" id="v-ak">bakılıyor…</span></div>
  <div class="row"><span class="n"><span class="dot" id="d-tp"></span>Toplantı</span><span class="v" id="v-tp"></span></div>
  <div class="row"><span class="n"><span class="dot" id="d-sn"></span>Senin sesin</span><span class="v" id="v-sn"></span></div>
  <div class="row"><span class="n"><span class="dot" id="d-kr"></span>Karşı taraf</span><span class="v" id="v-kr"></span></div>
  <div class="row"><span class="n"><span class="dot" id="d-cl"></span>Claude</span><span class="v" id="v-cl"></span></div>
</div>
<div class="bt"><button class="pri grow" id="pano">Panoyu aç</button></div>
<div class="not"><textarea id="note" rows="2" placeholder="Not düş · soru için başa ?, soru, Claude ya da iki boşluk (Enter: gönder)"></textarea>
<div class="bt"><button id="send">Gönder</button><span class="ok-t" id="noteRes"></span></div></div>
<details><summary>Ayarlar</summary><div class="set">
  <label class="ck"><input type="checkbox" id="en"> Aktarım açık</label>
  <label class="ck"><input type="checkbox" id="wh"> Whisper: konuşmayı bu Mac'te yazıya çevir</label>
  <label class="ck"><input type="checkbox" id="ac"> Toplantıya girince altyazıyı kendisi açsın</label>
  <label>Satırı göndermeden önce bekleme<select id="stab"><option value="3000">3 sn (hızlı)</option><option value="6000">6 sn</option></select></label>
  <label>Uyarı kelimeleri (virgülle)<input id="kw"></label>
  <label>Çalışma alanı<select id="alansec"></select></label>
  <label>Aktarıcı adresi<input id="relay"></label>
  <div class="bt"><button id="save">Kaydet</button><span class="ok-t" id="saveRes"></span></div>
</div></details>
<script src="popup.js"></script></html>
